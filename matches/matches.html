<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Match Schedule - FIFA World Cup Fan Hub</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../music-player.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      background: #f5f7fb;
      color: #082653;
      overflow-x: hidden;
    }

    .hero-sub {
      min-height: 500px;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: white;
      overflow: hidden;
      background:
        linear-gradient(rgba(0, 20, 47, .62), rgba(0, 20, 47, .72)),
        url("https://images.unsplash.com/photo-1574629810360-7efbbe195018?w=1800");
      background-size: cover;
      background-position: center;
    }

    nav {
      position: absolute;
      top: 25px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      min-height: 75px;
      padding: 0 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      background: rgba(0, 20, 47, .58);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, .18);
      border-radius: 20px;
      z-index: 10;
    }

    .logo {
      color: white;
      font-size: 26px;
      font-weight: 800;
      text-decoration: none;
      white-space: nowrap;
    }

    .logo span {
      color: #ffd700;
    }

    .menu {
      display: flex;
      align-items: center;
      gap: 28px;
    }

    .menu a {
      color: white;
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: .3s;
    }

    .menu a:hover,
    .menu a.active {
      color: #ffd700;
    }

    .ticket-btn {
      border: none;
      border-radius: 50px;
      padding: 12px 24px;
      background: #ffd700;
      color: #111;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .hero-sub-content {
      position: relative;
      z-index: 2;
      margin-top: 60px;
      padding: 20px;
    }

    .hero-sub-content h1 {
      font-size: clamp(42px, 7vw, 78px);
      line-height: 1.05;
      font-weight: 900;
    }

    .hero-sub-content p {
      margin-top: 18px;
      font-size: clamp(16px, 2vw, 22px);
      color: rgba(255, 255, 255, .9);
    }

    .matches-section {
      padding: 75px 7%;
      background: #f5f7fb;
    }

    .page-heading {
      text-align: center;
      margin-bottom: 35px;
    }

    .page-heading h2 {
      font-size: 34px;
      font-weight: 800;
      color: #082653;
    }

    .page-heading p {
      color: #777;
      margin-top: 8px;
    }

    .filters {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 14px;
      margin-bottom: 55px;
    }

    .filters button {
      border: none;
      border-radius: 50px;
      padding: 12px 24px;
      background: white;
      color: #082653;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 5px 18px rgba(0, 0, 0, .08);
      transition: .3s;
    }

    .filters button:hover,
    .filters button.active {
      background: #082653;
      color: white;
      transform: translateY(-2px);
    }

    .match-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 28px;
    }

    .match-card {
      background: white;
      border-radius: 25px;
      padding: 24px;
      min-height: 405px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, .07);
      border: 1px solid rgba(0, 0, 0, .04);
      transition: .3s ease;
      display: flex;
      flex-direction: column;
    }

    .match-card:hover {
      transform: translateY(-7px);
      box-shadow: 0 20px 42px rgba(0, 0, 0, .13);
    }

    .match-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding-bottom: 17px;
      border-bottom: 1px solid #edf0f4;
    }

    .stage {
      color: #0d4d9c;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .4px;
      text-transform: uppercase;
    }

    .status {
      padding: 5px 10px;
      border-radius: 30px;
      background: #eaf8ef;
      color: #239653;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }

    .match-teams {
      display: grid;
      grid-template-columns: 1fr 60px 1fr;
      align-items: center;
      gap: 8px;
      flex: 1;
      padding: 25px 0 20px;
    }

    .team {
      text-align: center;
    }

    .team-flag {
      width: 76px;
      height: 50px;
      object-fit: cover;
      border-radius: 9px;
      display: block;
      margin: 0 auto 13px;
      box-shadow: 0 5px 12px rgba(0, 0, 0, .14);
    }

    .team h3 {
      color: #082653;
      font-size: 16px;
      line-height: 1.3;
      font-weight: 700;
    }

    .vs {
      text-align: center;
      color: #999;
      font-size: 14px;
      font-weight: 900;
    }

    .match-info {
      display: grid;
      gap: 8px;
      padding: 14px;
      border-radius: 15px;
      background: #f1f3f8;
      color: #666;
      font-size: 12px;
    }

    .match-info strong {
      color: #222;
    }

    .highlight-btn {
      width: 100%;
      margin-top: 15px;
      padding: 12px;
      border: none;
      border-radius: 12px;
      background: #ffd700;
      color: #111;
      font-weight: 700;
      cursor: pointer;
      transition: .25s;
    }

    .highlight-btn:hover {
      background: #e6c200;
    }

    footer {
      margin-top: 30px;
      padding: 55px 20px;
      background: #00142f;
      color: white;
      text-align: center;
    }

    footer h2 {
      font-size: 24px;
    }

    footer p {
      margin-top: 10px;
      color: rgba(255, 255, 255, .7);
    }

    @media (max-width: 1150px) {
      .match-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .menu {
        gap: 16px;
      }
    }

    @media (max-width: 800px) {
      nav {
        width: 94%;
        padding: 0 18px;
      }

      .menu {
        display: none;
      }

      .match-grid {
        grid-template-columns: 1fr;
      }

      .matches-section {
        padding: 55px 5%;
      }
    }

    @media (max-width: 450px) {
      .logo {
        font-size: 21px;
      }

      .ticket-btn {
        padding: 10px 15px;
        font-size: 12px;
      }

      .filters button {
        padding: 10px 16px;
        font-size: 12px;
      }
    }
  </style>
</head>

<body>

  <header class="hero-sub">
    <nav>
      <div class="logo">🏆 FIFA<span>HUB</span></div>

      <div class="menu">
        <a href="../index.html">Home</a>
        <a href="../teams/teams.html">Teams</a>
        <a href="matches.html" class="active">Matches</a>
        <a href="../players/players.html">Players</a>
        <a href="../stadium.html">Stadiums</a>
        <a href="../gallery.html">Gallery</a>
        <a href="../news.html">News</a>
      </div>

      <a href="../index.html">
        <button class="ticket-btn">Buy Tickets</button>
      </a>
    </nav>

    <div class="hero-sub-content">
      <h1>Match Schedule</h1>
      <p>Track all 104 fixtures across the 16 host cities</p>
    </div>
  </header>

  <main class="matches-section">
    <div class="page-heading">
      <h2>FIFA World Cup Matches</h2>
      <p>Browse matches by tournament stage</p>
    </div>

    <div class="filters">
      <button class="active" onclick="filterMatches('all', this)">All Matches</button>
      <button onclick="filterMatches('group', this)">Group Stage</button>
      <button onclick="filterMatches('quarter', this)">Quarter Finals</button>
      <button onclick="filterMatches('semi', this)">Semi Finals</button>
      <button onclick="filterMatches('final', this)">Finals</button>
    </div>

    <div class="match-grid" id="matchGrid"></div>
  </main>

  <footer>
    <h2>FIFA World Cup Fan Hub</h2>
    <p>The Ultimate Football Experience</p>
  </footer>

        ],
        halftimeLinks: [
          "https://youtube.com/playlist?list=PLGzheOzIVpHk&si=qkx68jCRuKLHIQCH"
        ]
      }
    ];

    const matchGrid = document.getElementById("matchGrid");

    function createLinks(links, text) {
      if (!Array.isArray(links) || links.length === 0) {
        return "";
      }

      return links.map((url, index) => `
        <a href="${url}" target="_blank" rel="noopener noreferrer">
          <button class="highlight-btn">
            ${text} ${links.length > 1 ? index + 1 : ""}
          </button>
        </a>
      `).join("");
    }

    function createMatchCard(match) {
      const homeFlag = `https://flagcdn.com/w160/${match.homeFlag}.png`;
      const awayFlag = `https://flagcdn.com/w160/${match.awayFlag}.png`;

      return `
        <article class="match-card" data-stage="${match.stage}">
          <div class="match-top">
            <span class="stage">${match.label}</span>
            <span class="status">Finished</span>
          </div>

          <div class="match-teams">
            <div class="team">
              <img
                class="team-flag"
                src="${homeFlag}"
                alt="${match.home} flag"
              >
              <h3>${match.home}</h3>
            </div>

            <div class="vs">VS</div>

            <div class="team">
              <img
                class="team-flag"
                src="${awayFlag}"
                alt="${match.away} flag"
              >
              <h3>${match.away}</h3>
            </div>
          </div>

          <div class="match-info">
            <div><strong>Date:</strong> ${match.date}</div>
            <div><strong>Venue:</strong> ${match.venue}</div>
          </div>

          <a href="${match.link}" target="_blank" rel="noopener noreferrer">
            <button class="highlight-btn">See Match Highlight</button>
          </a>

          ${createLinks(match.openLinks, "Watch Opening Ceremony")}
          ${createLinks(match.closeLinks, "Watch Closing Ceremony")}
          ${createLinks(match.halftimeLinks, "Watch Halftime Show")}

          ${
            match.trophyLink
              ? `
                <a href="${match.trophyLink}" target="_blank" rel="noopener noreferrer">
                  <button class="highlight-btn">
                    Watch Trophy Ceremony
                  </button>
                </a>
              `
              : ""
          }
        </article>
      `;
    }

    function showMatches(stage = "all") {
      const filteredMatches =
        stage === "all"
          ? matches
          : matches.filter(match => match.stage === stage);

      matchGrid.innerHTML = filteredMatches
        .map(createMatchCard)
        .join("");
    }

    function filterMatches(stage, button) {
      document.querySelectorAll(".filters button").forEach(btn => {
        btn.classList.remove("active");
      });

      button.classList.add("active");
      showMatches(stage);
    }

    showMatches();
  </script>
