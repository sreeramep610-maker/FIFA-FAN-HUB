<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FIFA Fan Hub | Top Players</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../music-player.css">
<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  background:#081223;
  color:white;
  overflow-x:hidden;
}

nav{
  position:absolute;
  top:25px;
  left:50%;
  transform:translateX(-50%);
  width:90%;
  height:75px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:rgba(255,255,255,.08);
  backdrop-filter:blur(15px);
  border:1px solid rgba(255,255,255,.15);
  padding:0 30px;
  border-radius:20px;
  z-index:999;
}

.logo{
  font-size:26px;
  font-weight:800;
  color:white;
}

.logo span{
  color:#FFD700;
}

.menu{
  display:flex;
  gap:35px;
}

.menu a{
  text-decoration:none;
  color:#000;
  font-size:14px;
  font-weight:500;
}


.back-btn{
text-decoration:none;
background:#FFD700;
color:#000;
padding:12px 25px;
border-radius:30px;
font-weight:600;
}

/* HERO */
.hero{
  height:65vh;
  background:
    linear-gradient(rgba(0,0,0,.4),
    rgba(0,0,0,.8)),
    url("https://images.unsplash.com/photo-1574629810360-7efbbe195018?w=1800");
  background-size:cover;
  background-position:center;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.hero h1{
  font-size:90px;
  font-weight:800;
}

.hero p{
  font-size:20px;
  margin-top:10px;
}

/* CONTENT */
.container{
  padding:80px 8%;
}

/* SEARCH */
.search{
  display:flex;
  justify-content:center;
  margin-bottom:40px;
}

.search input{
  width:600px;
  max-width:100%;
  padding:18px;
  border:none;
  border-radius:50px;
  font-size:16px;
  outline: none;
}

/* FILTERS */
.filters{
  display:flex;
  justify-content:center;
  gap:15px;
  flex-wrap:wrap;
  margin-bottom:50px;
}

.filters button{
  padding:12px 25px;
  border:none;
  border-radius:50px;
  cursor:pointer;
  font-weight:600;
  background: rgba(255, 255, 255, 0.1);
  color: white;
  transition: 0.3s;
}

.filters button:hover{
  background: #FFD700;
  color: #081223;
}

/* GRID */
.players-grid{
  display:grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap:30px;
}

/* CARD */
.player-card{
  background:#fff;
  color:#081223;
  border-radius:24px;
  backdrop-filter:blur(15px);
  overflow:hidden;
  cursor:pointer;
  transition:.4s;
}

.player-card:hover{
  transform:translateY(-12px);
  box-shadow:0 20px 40px rgba(0,0,0,.35);
}

.player-image{
  height:420px;
  overflow:hidden;
}

.player-image img{
  width:100%;
  height:100%;
  object-fit:cover;
  transition:.5s;
}

.player-card:hover img{
  transform:scale(1.08);
}

.player-content{
  padding:25px;
}

.player-content h2{
  font-size:28px;
}

.player-content p{
  opacity:.8;
  margin-top:5px;
}

.stats{
  margin-top:20px;
  display:flex;
  justify-content:space-between;
}

.stat{
  text-align:center;
}

.stat h3{
  color:#b89700;
}

/* FOOTER */
footer{
  margin-top:80px;
  background:#00142f;
  padding:40px;
  text-align:center;
}
</style>
</head>
<body>

<nav>
  <div class="logo">
    🏆 FIFA<span>HUB</span>
  </div>
  <div class="menu">

  <a href="../news.html" class="back-btn">
← Back to News
</a>

</nav>

<section class="hero">
  <div>
    <h1>TOP PLAYERS</h1>
    <p>The stars expected to dominate in 2026</p>
  </div>
</section>

<div class="container">
  <div class="search">
    <input type="text" id="searchInput" placeholder="Search Players...">
  </div>

  <div class="filters">
    <button onclick="filterPlayers('all')">All</button>
    <button onclick="filterPlayers('Forward')">Forwards</button>
    <button onclick="filterPlayers('Midfielder')">Midfielders</button>
    <button onclick="filterPlayers('Defender')">Defenders</button>
    <button onclick="filterPlayers('Goalkeeper')">Goalkeepers</button>
  </div>

  <div class="players-grid" id="playersGrid"></div>
</div>

<footer>
  <h2>🏆 FIFA World Cup Fan Hub</h2>
  <p>The Biggest Football Stars In One Place</p>
</footer>

    <!-- Ensure your data file is loaded here -->
    <script src="top.js"></script>

<script>
const grid = document.getElementById("playersGrid");
const playersArray = Object.values(players);

function renderPlayers(data = playersArray){
  grid.innerHTML="";
  data.forEach(player=>{
    grid.innerHTML += `
      <div class="player-card" onclick="openPlayer('${player.id}')">
        <div class="player-image">
          <img src="${player.image || '../images/default-player.jpg'}" onerror="this.src='../images/default-player.jpg'">
        </div>
        <div class="player-content">
          <h2>${player.name}</h2>
          <p>${player.country} • ${player.position}</p>
          <div class="stats">
            <div class="stat">
              <h3>${player.rating}</h3>
              <p>Rating</p>
            </div>
            <div class="stat">
              <h3>${player.goals}</h3>
              <p>Goals</p>
            </div>
            <div class="stat">
              <h3>${player.assists}</h3>
              <p>Assists</p>
            </div>
          </div>
        </div>
      </div>
    `;
  });
}

renderPlayers(playersArray);

function openPlayer(id){
  window.location.href = `top.html?id=${id}`;
}

function filterPlayers(pos){
  if(pos==="all"){
    renderPlayers(playersArray);
    return;
  }
  renderPlayers(
    playersArray.filter(p => p.position === pos)
  );
}

document.getElementById("searchInput").addEventListener("keyup", function(){
  const value = this.value.toLowerCase();
  renderPlayers(
    playersArray.filter(player =>
      player.name.toLowerCase().includes(value) ||
      player.country.toLowerCase().includes(value) ||
      player.position.toLowerCase().includes(value)
    )
  );
});

document.getElementById("buyTickets").addEventListener("click", () => {
  window.location.href = "../index.html";
});
</script>
<script src="../music-player.js" defer></script>
</body>
</html>
