<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Player Details | FIFA Fan Hub</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../music-player.css">
<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#081223;
color:white;
min-height:100vh;
}

nav{
width:100%;
padding:20px 8%;
display:flex;
justify-content:space-between;
align-items:center;
background:rgba(255,255,255,.08);
backdrop-filter:blur(15px);
}

.logo{
font-size:28px;
font-weight:800;
}

.logo span{
color:#FFD700;
}

.back-btn{
text-decoration:none;
background:#FFD700;
color:#000;
padding:12px 25px;
border-radius:30px;
font-weight:600;
}

.container{
width:90%;
max-width:1200px;
margin:50px auto;
}

.player-box{
display:grid;
grid-template-columns:400px 1fr;
gap:50px;
align-items:center;
}

.player-image img{
width:100%;
border-radius:25px;
box-shadow:0 20px 50px rgba(0,0,0,.4);
}

.player-info h1{
font-size:52px;
margin-bottom:10px;
}

.country{
font-size:20px;
color:#FFD700;
margin-bottom:30px;
}

.info-grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:20px;
margin-bottom:35px;
}

.info-card{
background:rgba(255,255,255,.08);
padding:20px;
border-radius:18px;
}

.info-card h3{
font-size:15px;
opacity:.7;
margin-bottom:8px;
}

.info-card p{
font-size:20px;
font-weight:600;
}

.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:20px;
margin:40px 0;
}

.stat{
background:#FFD700;
color:#081223;
padding:25px;
text-align:center;
border-radius:20px;
}

.stat h2{
font-size:36px;
}

.stat p{
font-weight:600;
margin-top:10px;
}

.bio{
background:rgba(255,255,255,.08);
padding:25px;
border-radius:20px;
line-height:1.8;
}

.not-found{
text-align:center;
padding:120px 20px;
}

.not-found h1{
font-size:50px;
margin-bottom:20px;
}

@media(max-width:900px){

.player-box{
grid-template-columns:1fr;
}

.player-image{
text-align:center;
}

.player-image img{
max-width:400px;
}

.stats{
grid-template-columns:repeat(2,1fr);
}

.info-grid{
grid-template-columns:1fr;
}

.player-info h1{
font-size:40px;
}

}

</style>
</head>

<body>

<nav>

<div class="logo">
🏆 FIFA <span>HUB</span>
</div>

<a href="top-10.html" class="back-btn">
← Back to Top Players
</a>

</nav>

<div class="container">

<div id="playerContainer"></div>

</div>

    <!-- Ensure your data file is loaded here -->
    <script src="top.js"></script>

<script>

const params=new URLSearchParams(window.location.search);
const id=params.get("id");

const player=players[id];

const container=document.getElementById("playerContainer");

if(!player){

container.innerHTML=`
<div class="not-found">
<h1>Player Not Found</h1>
<p>This player does not exist.</p>
<br><br>
<a href="players.html" class="back-btn">Go Back</a>
</div>
`;

}else{

container.innerHTML=`

<div class="player-box">

<div class="player-image">

<img src="${player.image || '../images/default-player.jpg'}"
onerror="this.src='../images/default-player.jpg'">

</div>

<div class="player-info">

<h1>${player.name}</h1>

<div class="country">
${player.country}
</div>

<div class="info-grid">

<div class="info-card">
<h3>Fifa Ranking</h3>
<p>${player.ranking}</p>
</div>

<div class="info-card">
<h3>Club</h3>
<p>${player.club}</p>
</div>

<div class="info-card">
<h3>Position</h3>
<p>${player.position}</p>
</div>

<div class="info-card">
<h3>Age</h3>
<p>${player.age}</p>
</div>

<div class="info-card">
<h3>Height</h3>
<p>${player.height}</p>
</div>

<div class="info-card">
<h3>Weight</h3>
<p>${player.weight}</p>
</div>

<div class="info-card">
<h3>Rating</h3>
<p>${player.rating}</p>
</div>

</div>

<div class="stats">

<div class="stat">
<h2>${player.goals}</h2>
<p>Goals</p>
</div>

<div class="stat">
<h2>${player.assists}</h2>
<p>Assists</p>
</div>

<div class="stat">
<h2>${player.rating}</h2>
<p>Overall</p>
</div>

<div class="stat">
<h2>${player.age}</h2>
<p>Age</p>
</div>

</div>

<div class="bio">

<h2>Biography</h2>

<br>

<p>${player.description}</p>

</div>

</div>

</div>

`;

}

</script>
<script src="../music-player.js" defer></script>
</body>
</html>
