<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FIFA Fan Hub | Players</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../music-player.css">
<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#ffffff;
color:white;
overflow-x:hidden;
}
/* NAVBAR */

nav{
position:absolute;
top:25px;
width:90%;
height:75px;
background:rgba(58,74,15,.55);
backdrop-filter:blur(18px);
border:1px solid rgba(255,255,255,.2);
border-radius:20px;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 30px;
}

.logo{
font-size:26px;
font-weight:800;
color:white;
text-decoration:none;
}
.logo span{ color:#FFD700; }

.menu{ display:flex; gap:30px; }

.menu a{
color:white;
text-decoration:none;
font-size:14px;
font-weight:500;
}
.menu a:hover,
.menu .active{ color:#FFD700; }

.ticket-btn{
padding:12px 25px;
border-radius:50px;
border:none;
font-weight:700;
cursor:pointer;
background:#FFD700;
}

/* HERO */

.hero{
height:65vh;

background:
linear-gradient(rgba(0,0,0,.4),
rgba(0,0,0,.8)),
url("https://images.unsplash.com/photo-1574629810360-7efbbe195018?w=1800");

background-size:cover;
background-position:center;

display:flex;
align-items:center;
justify-content:center;
text-align:center;
}

.hero h1{
font-size:90px;
font-weight:800;
}

.hero p{
font-size:20px;
margin-top:10px;
}

  /* CONTENT */
        .container { padding: 80px 8%; }
        .search-area { display: flex; justify-content: center; margin-bottom: 35px; }
        .search-area input { width: 650px; padding: 18px; border: none; outline: none; border-radius: 18px; font-size: 16px; box-shadow: 0 10px 25px rgba(0,0,0,.08); }


.filters { display: flex; justify-content: center; flex-wrap: wrap; gap: 15px; margin-bottom: 60px; }
        .filters button { padding: 12px 25px; border: none; border-radius: 50px; background: white; cursor: pointer; font-weight: 600; box-shadow: 0 5px 15px rgba(0,0,0,.08); transition: .3s; }
        .filters button:hover { background: #001f54; color: white; }

/* GRID */

.players-grid{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(300px,1fr));
gap:30px;
}

/* CARD */

.player-card{

background:#fff;
color:#081223;
border-radius:24px;

backdrop-filter:blur(15px);

border-radius:25px;

overflow:hidden;

cursor:pointer;

transition:.4s;
box-shadow: 0 12px 30px rgba(0,0,0,.05); border: 1px solid #eee;
}

.player-card:hover{
    transform:translateY(-12px);
    box-shadow:0 20px 40px rgba(0,0,0,.35);
}

.player-image{
height:420px;
overflow:hidden;
}

.player-image img{
width:100%;
height:100%;
object-fit:cover;
transition:.5s;
}

.player-card:hover img{
    transform:scale(1.08);
}

.player-content{
padding:25px;
}

.player-content h2{
font-size:28px;
}

.player-content p{
opacity:.8;
margin-top:5px;
}

.stats{
margin-top:20px;

display:flex;
justify-content:space-between;
}

.stat{
text-align:center;
}

.stat h3{
color:#FFD700;
}

/* FOOTER */

footer{
margin-top:80px;
background:#00142f;
padding:40px;
text-align:center;
}

</style>
</head>
<body>
    <nav>

<div class="logo">
🏆 FIFA<span>HUB</span>
</div>


<div class="menu">
    <a href="../index.html">Home</a>
    <a href="../teams/teams.html">Teams</a>
    <a href="../matches/matches.html">Matches</a>
    <a href="players.html" class="active">Players</a>
    <a href="../stadium.html">Stadiums</a>
    <a href="../gallery.html">Gallery</a>
    <a href="../news.html">News</a>
</div>

<button class="ticket-btn" id="buyTickets">
Buy Tickets
</button>

</nav>

<section class="hero">

<div>

<h1>PLAYERS</h1>

<p>
World Class Stars Of FIFA World Cup 2026
</p>

</div>

</section>

<div class="container">
        <div class="search-area">
            <input type="text" id="searchInput" placeholder="Search players...">
</div>

<div class="filters">

<button onclick="filterPlayers('all')">
All
</button>

<button onclick="filterPlayers('Forward')">
Forwards
</button>

<button onclick="filterPlayers('Midfielder')">
Midfielders
</button>

<button onclick="filterPlayers('Defender')">
Defenders
</button>

<button onclick="filterPlayers('Goalkeeper')">
Goalkeepers
</button>

</div>

<div
class="players-grid"
id="playersGrid">
</div>

</div>

<footer>

<h2>🏆 FIFA World Cup Fan Hub</h2>

<p>
The Biggest Football Stars In One Place
</p>

</footer>
 <!-- Ensure your data file is loaded here -->
    <script src="players-data.js"></script>
    
<script>
const grid = document.getElementById("playersGrid");

// Convert object to array
const playersArray = Object.values(players);

function renderPlayers(data = playersArray){

grid.innerHTML="";

data.forEach(player=>{

grid.innerHTML += `

<div
class="player-card"
onclick="openPlayer('${player.id}')">

<div class="player-image">

<img
src="${player.image || '../images/default-player.jpg'}"
onerror="this.src='../images/default-player.jpg'">

</div>

<div class="player-content">

<h2>${player.name}</h2>

<p>
${player.country}
•
${player.position}
</p>

<div class="stats">

<div class="stat">
<h3>${player.rating}</h3>
<p>Rating</p>
</div>

<div class="stat">
<h3>${player.goals}</h3>
<p>Goals</p>
</div>

<div class="stat">
<h3>${player.assists}</h3>
<p>Assists</p>
</div>

</div>

</div>

</div>

`;

});

}

renderPlayers(playersArray);

function openPlayer(id){

window.location.href =
`player.html?id=${id}`;

}

function filterPlayers(pos){

if(pos==="all"){
renderPlayers(playersArray);
return;
}

renderPlayers(
    playersArray.filter(
        p => p.position === pos
    )
);

}

document
.getElementById("searchInput")
.addEventListener("keyup",function(){

const value =
this.value.toLowerCase();

renderPlayers(

playersArray.filter(player=>

player.name.toLowerCase().includes(value)
||
player.country.toLowerCase().includes(value)
||
player.position.toLowerCase().includes(value)

)

);

});

</script>
<script>

document.getElementById("buyTickets").addEventListener("click", () => {
    window.location.href = "../index.html";
});
</script>
<script src="../music-player.js" defer></script>
</body>
</html>
